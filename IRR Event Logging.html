<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>IRR EVENT LOGGER</title>

<style>
body {
    font-family: Calibri, Arial, sans-serif;
    background: radial-gradient(#cfcfcf 1px, transparent 1px);
    background-size: 6px 6px;
    padding: 30px;
}

.wrapper { width: 1100px; margin: auto; position: relative; }

.logo {
    position: absolute;
    top: 0;
    right: 0;
    text-align: center;
    width: 220px;
}

.logo img { width: 220px; }

.clock {
    margin-top: 10px;
    font-size: 16px;
    font-weight: bold;
    color: darkblue;
}

.open-flight-box {
    margin-top: 15px;
    display: none;
}

.open-flight-box button {
    margin: 5px;
}

.grey-btn { background: #bfbfbf; }

.header { text-align: center; margin-bottom: 40px; }

.section-number {
    background: yellow;
    display: inline-block;
    padding: 2px 8px;
    font-weight: bold;
}

.box {
    background: #d9d9d9;
    border: 2px solid black;
    padding: 15px;
    margin-top: 10px;
}

input, select {
    background: #ffc000;
    border: 1px solid black;
    padding: 3px;
    font-family: Calibri;
}

input.small { width: 100px; }
input.medium { width: 160px; }
input.long { width: 450px; }

button {
    padding: 6px 14px;
    font-weight: bold;
    cursor: pointer;
    border: 1px solid black;
}

.reset-btn { background: red; color: white; }
.generate-btn { background: #92d050; }
.copy-btn { background: #bdd7ee; }

.output-box {
    background: #efefef;
    border: 2px solid #1f7a3f;
    padding: 10px;
    height: 240px;
    width: 750px;
    white-space: pre-wrap;
    font-family: "Courier New", monospace;
}

/* Modal */
.modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.4);
}

.modal-box {
    background: white;
    width: 350px;
    padding: 20px;
    margin: 15% auto;
    text-align: center;
    border: 2px solid black;
}
</style>
</head>

<body>

<div class="wrapper">

<div class="logo">
    <img src="./safety-logo.png" alt="Safety Logo">
    <div id="clock" class="clock"></div>

    <div class="open-flight-box" id="openFlightBox">
        <div><b>Open flight in:</b></div>
        <button class="grey-btn" onclick="openTidy()">TIDY</button>
        <button class="grey-btn" onclick="openBono()">BONO</button>
    </div>
</div>

<div class="header">
<h1>IRR EVENT LOGGER</h1>
<div><i>Rev 2.4</i></div>
</div>

<!-- SECTION 1 -->
<span class="section-number">1)</span>
<div class="box" style="width:500px;">
<b>Regarding flight</b>
<button class="reset-btn" style="float:right;" onclick="resetForm()">Reset</button>
<br><br>

Flightnumber:
<input id="flight" class="medium" oninput="checkOpenFlightButtons()"><br><br>

Date:
<input id="date" class="medium" oninput="checkOpenFlightButtons()">
<button onclick="setToday()">Set todays date</button><br><br>

Pax Figures:
<input id="pax" class="small">
</div>

<br>

<!-- SECTION 2 -->
<span class="section-number">2)</span>
<div class="box" style="width:750px;">
<b>Event Details</b><br><br>
Type:
<input id="eventType" class="medium"><br><br>
Description:<br>
<input id="description" class="long">
</div>

<br>

<!-- SECTION 3 -->
<span class="section-number">3)</span>
<div class="box" style="width:750px;">
<b>Generate Report</b><br><br>

<button class="generate-btn" onclick="generateText()">Generate</button>
<button class="copy-btn" onclick="copyText()">Copy</button>

<br><br>

<div id="output" class="output-box"></div>
</div>

</div>

<!-- MODAL -->
<div id="modal" class="modal-overlay">
<div class="modal-box">
<div id="modalText"></div><br>
<button onclick="closeModal()">OK</button>
</div>
</div>

<script>

/* CLOCK */
function updateClock(){
    let now = new Date();
    document.getElementById("clock").innerText =
        now.toUTCString().slice(17,22) + " UTC";
}
setInterval(updateClock,1000);
updateClock();

/* SHOW TIDY/BONO */
function checkOpenFlightButtons() {
    let flight = document.getElementById("flight").value.trim();
    let date = document.getElementById("date").value.trim();
    document.getElementById("openFlightBox").style.display =
        (flight && date) ? "block" : "none";
}

/* DATE TODAY */
function setToday(){
    let d = new Date();
    let day = String(d.getUTCDate()).padStart(2,'0');
    let monthNames = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
    let month = monthNames[d.getUTCMonth()];
    let year = String(d.getUTCFullYear()).slice(2);
    document.getElementById("date").value = day + month + year;
    checkOpenFlightButtons();
}

/* GENERATE */
function generateText(){
    let flight = document.getElementById("flight").value;
    let date = document.getElementById("date").value;
    let pax = document.getElementById("pax").value;
    let type = document.getElementById("eventType").value;
    let desc = document.getElementById("description").value;

    if(!flight || !date){
        showModal("Flight number and date required.");
        return;
    }

    let output =
`FLIGHT: ${flight}
DATE: ${date}
PAX: ${pax}

EVENT TYPE: ${type}
DESCRIPTION:
${desc}`;

    document.getElementById("output").innerText = output;
    showModal("Report generated.");
}

/* COPY */
function copyText(){
    let text = document.getElementById("output").innerText;
    if(!text){
        showModal("Nothing to copy.");
        return;
    }
    navigator.clipboard.writeText(text);
    showModal("Copied to clipboard.");
}

/* RESET */
function resetForm(){
    document.querySelectorAll("input").forEach(i => i.value = "");
    document.getElementById("output").innerText = "";
    checkOpenFlightButtons();
    showModal("Form reset.");
}

/* MODAL */
function showModal(msg){
    document.getElementById("modalText").innerText = msg;
    document.getElementById("modal").style.display = "block";
}

function closeModal(){
    document.getElementById("modal").style.display = "none";
}

/* TIDY/BONO */
function convertDateFormats() {
    let input = document.getElementById("date").value.trim();
    let match = input.match(/^(\d{1,2})([A-Za-z]{3})(\d{2})$/);
    if (!match) return null;

    let day = match[1].padStart(2,'0');
    let monthStr = match[2].toUpperCase();
    let year = "20" + match[3];

    const months = {
        JAN:"01", FEB:"02", MAR:"03", APR:"04", MAY:"05", JUN:"06",
        JUL:"07", AUG:"08", SEP:"09", OCT:"10", NOV:"11", DEC:"12"
    };

    let month = months[monthStr];
    if (!month) return null;

    return {
        tidy: `${day}/${month}/${year}`,
        bono: `${day}-${month}-${year}`
    };
}

function openTidy(){
    let flight = document.getElementById("flight").value.toUpperCase();
    let d = convertDateFormats();
    if(!d) return;
    window.open(
`https://tidy.nas.dev/View/CDM/CDMFlightDetails.aspx?flightid=${flight}&flightdate=${d.tidy}`,
"_blank");
}

function openBono(){
    let flight = document.getElementById("flight").value.toUpperCase();
    let d = convertDateFormats();
    if(!d) return;
    window.open(
`https://bono.nas.dev/nas/actions/flightreport/flightreport.action?searchBy=flightAndDate&flight=${flight}&flightDate=${d.bono}&includeDeleted=false&limit=300&offset=0`,
"_blank");
}

</script>
</body>
</html>
