<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>IRR EVENT Logging toolr</title>

<style>
body {
    font-family: Calibri, Arial, sans-serif;
    background: radial-gradient(#cfcfcf 1px, transparent 1px);
    background-size: 6px 6px;
    padding: 30px;
}

.wrapper { width: 1100px; margin: auto; position: relative; }

.logo {
    position: absolute;
    top: 0;
    right: 0;
    text-align: center;
    width: 220px;
}

.logo img {
    width: 220px;
}

.clock {
    margin-top: 10px;
    font-size: 16px;
    font-weight: bold;
    color: darkblue;
    text-align: center;
}

.header {
    text-align: center;
    margin-bottom: 40px;
}

h1 { margin-bottom: 0; }
.rev { font-style: italic; margin-bottom: 20px; }

.section-number {
    background: yellow;
    display: inline-block;
    padding: 2px 8px;
    font-weight: bold;
}

.box {
    background: #d9d9d9;
    border: 2px solid black;
    padding: 15px;
    margin-top: 10px;
}

input, select {
    background: #ffc000;
    border: 1px solid black;
    padding: 3px;
    font-family: Calibri;
}

input.small { width: 100px; }
input.medium { width: 160px; }
input.long { width: 450px; }
select.medium { width: 180px; }
select.long { width: 520px; }

button {
    padding: 6px 14px;
    font-weight: bold;
    cursor: pointer;
    border: 1px solid black;
}

.reset-btn { background: red; color: white; }
.generate-btn { background: #92d050; }
.copy-btn { background: #bdd7ee; }

.green-text {
    color: green;
    font-style: italic;
    margin-left: 15px;
}

.output-box {
    background: #efefef;
    border: 2px solid #1f7a3f;
    padding: 10px;
    height: 240px;
    width: 750px;
    white-space: pre-wrap;
    font-family: "Courier New", monospace;
}

.modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.4);
}

.modal-box {
    background: white;
    width: 350px;
    padding: 20px;
    margin: 15% auto;
    text-align: center;
    border: 2px solid black;
}
</style>
</head>

<body>

<div class="wrapper">

<div class="logo">
    <img src="./safety-logo.png" alt="Safety Logo">
    <div id="clock" class="clock"></div>
</div>

<div class="header">
<h1>IRR EVENT Logging tool</h1>
<div class="rev">Rev 2.4</div>
</div>

<!-- SECTION 1 -->
<div>
<span class="section-number">1)</span>
<div class="box" style="width:500px;">
<b>Regarding flight</b>
<button class="reset-btn" style="float:right;" onclick="resetForm()">Reset</button>
<br><br>

Flightnumber:
<input id="flight" class="medium"><br><br>

Date:
<input id="date" class="medium">
<button onclick="setToday()">Set todays date</button><br><br>

Pax Figures:
<input id="pax" class="small">
</div>
</div>

<br>

<!-- SECTION 2 -->
<div>
<span class="section-number">2)</span>
<div class="box" style="width:1000px;">
<b>Specify Irregularity</b>
<br><br>

Irregularity:
<select id="irr" class="medium" onchange="updateReasonLabel()">
<option>Select</option>
<option>Cancelled</option>
<option>Delayed</option>
<option>Diversion</option>
</select>

&nbsp;&nbsp;

<span id="reason-label">Reason for cancellation:</span>
<select id="reason" class="medium">
<option>Select</option>
<option>Technical</option>
<option>Weather</option>
<option>Operational</option>
<option>Other</option>
</select>

&nbsp;&nbsp;

Rebooking:
<select id="rebooking" class="medium">
<option>Select</option>
<option>Yes</option>
<option>No</option>
</select>

<br><br>

Rebooking Solution:
<select id="solution" class="long">
<option>Select</option>
<option>No alternative option available</option>
<option>First available option</option>
<option>Ground transport arranged</option>
<option>No alternative transport available (pax must arrange own transport and get refund)</option>
<option>Recovery flight arranged</option>
</select>

<br><br>

Spare AC:
<select id="spare" class="medium">
<option>Select</option>
<option>Used</option>
<option>Not available</option>
<option>Not applicable. Would cause longer final delay.</option>
</select>

&nbsp;&nbsp;

Wetlease:
<select id="wetlease" class="medium">
<option>Select</option>
<option>Wetlease arranged</option>
<option>Not an option, would cause longer delay</option>
<option>Not an option due to availability</option>
</select>

<br><br>

Remark (Optional Freetext):
<br>
<input id="remark" class="long">

<br><br>

<button class="generate-btn" onclick="generate()">Generate</button>
<span id="ready" class="green-text"></span>
</div>
</div>

<br>

<!-- SECTION 3 -->
<div>
<span class="section-number">3)</span>
<div class="box" style="width:800px;">
<b>Copy to 15below</b>
<br><br>
<button class="copy-btn" onclick="copyText()">Copy</button>
<div id="output" class="output-box"></div>
</div>
</div>

</div>

<div class="modal-overlay" id="modal">
    <div class="modal-box">
        <div id="modal-message"></div>
        <br>
        <button onclick="closeModal()">OK</button>
    </div>
</div>

<script>

function updateReasonLabel() {
    let irrValue = document.getElementById("irr").value;
    let label = document.getElementById("reason-label");

    if (irrValue === "Delayed") {
        label.innerText = "Reason for delay:";
    } else if (irrValue === "Diversion") {
        label.innerText = "Reason for diversion:";
    } else {
        label.innerText = "Reason for cancellation:";
    }
}

document.querySelectorAll("input, select").forEach((el, index, arr) => {
    el.addEventListener("keydown", function(e) {
        if (e.key === "Enter") {
            e.preventDefault();
            let next = arr[index + 1];
            if (next) next.focus();
        }
    });
});

function updateClock() {
    let now = new Date();
    let hours = String(now.getHours()).padStart(2,'0');
    let minutes = String(now.getMinutes()).padStart(2,'0');
    let seconds = String(now.getSeconds()).padStart(2,'0');
    let day = String(now.getDate()).padStart(2,'0');
    let month = now.toLocaleString("en-US", { month: "short" }).toUpperCase();
    let year = now.getFullYear().toString().slice(-2);

    document.getElementById("clock").innerText =
        `${hours}:${minutes}:${seconds} / ${day}${month}${year}`;
}

setInterval(updateClock, 1000);
updateClock();

function setToday() {
    let today = new Date();
    let day = String(today.getDate()).padStart(2, '0');
    let month = today.toLocaleString("en-US", { month: "short" }).toUpperCase();
    let year = today.getFullYear().toString().slice(-2);
    document.getElementById("date").value = `${day}${month}${year}`;
}

function formatDate(input) {
    let match = input.trim().match(/^(\d{1,2})([a-zA-Z]{3})(\d{2})$/);
    if (!match) return input.toUpperCase();

    let day = match[1].padStart(2, '0');
    let month = match[2].toUpperCase();
    let year = match[3];

    return `${day}${month}${year}`;
}

function showModal(message) {
    document.getElementById("modal-message").innerText = message;
    document.getElementById("modal").style.display = "block";
}

function closeModal() {
    document.getElementById("modal").style.display = "none";
}

function validateSelects() {
    let selects = document.querySelectorAll("select");
    for (let s of selects) {
        if (s.value === "Select") {
            showModal("All dropdown fields must be selected before generating the report.");
            return false;
        }
    }
    return true;
}

function generate() {

    let flightValue = flight.value.trim();
    let paxValue = pax.value.trim();

    if (flightValue === "" || paxValue === "" || Number(paxValue) === 0) {
        showModal("Missing flight details");
        return;
    }

    if (!validateSelects()) return;

    let formattedDate = formatDate(date.value);

    let irrValue = irr.value;
    let reasonValue = reason.value;
    let remarkValue = remark.value.trim();

    let code = "";
    if (irrValue === "Cancelled") code = "CNL";
    if (irrValue === "Delayed") code = "DLY";
    if (irrValue === "Diversion") code = "DIV";

    if ((reasonValue === "Operational" || reasonValue === "Other") && remarkValue === "") {
        showModal("Remark is mandatory under set conditions.");
        return;
    }

    if (remarkValue !== "") {
        remarkValue = remarkValue.charAt(0).toUpperCase() + remarkValue.slice(1);
    }

    let header = `${flightValue.toUpperCase()} ${formattedDate} ${code}`;

    let text =
`${header}
Reason : ${reasonValue}
Pax Figures : ${paxValue}
Rebooking : ${rebooking.value}
Rebooking Solution : ${solution.value}
Spare AC : ${spare.value}
Wetlease : ${wetlease.value}`;

    if (remarkValue !== "") {
        text += `\nRemark: ${remarkValue}`;
    }

    document.getElementById("output").innerText = text;
    document.getElementById("ready").innerText = "Report ready";
}

function copyText() {
    let outputText = document.getElementById("output").innerText.trim();

    if (outputText === "") {
        showModal("Nothing to copy. Check input fields and dropdown menus.");
        return;
    }

    navigator.clipboard.writeText(outputText);
}

function resetForm() {
    document.querySelectorAll("input").forEach(i => i.value = "");
    document.querySelectorAll("select").forEach(s => s.selectedIndex = 0);
    document.getElementById("output").innerText = "";
    document.getElementById("ready").innerText = "";
}

</script>

</body>
</html>
