<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>IRR EVENT LOGGER</title>

<style>
body {
    font-family: Calibri, Arial, sans-serif;
    background: radial-gradient(#cfcfcf 1px, transparent 1px);
    background-size: 6px 6px;
    padding: 30px;
}

.wrapper { width: 1100px; margin: auto; position: relative; }

.logo {
    position: absolute;
    top: 0;
    right: 0;
    text-align: center;
    width: 220px;
}

.logo img { width: 220px; }

.clock {
    margin-top: 10px;
    font-size: 16px;
    font-weight: bold;
    color: darkblue;
    text-align: center;
}

.open-flight-box {
    margin-top: 15px;
    display: none;
    text-align: center;
}

.open-flight-box button {
    margin: 5px;
}

.grey-btn { 
    background: #bfbfbf; 
}

.header { text-align: center; margin-bottom: 40px; }
h1 { margin-bottom: 0; }
.rev { font-style: italic; margin-bottom: 20px; }

.section-number {
    background: yellow;
    display: inline-block;
    padding: 2px 8px;
    font-weight: bold;
}

.box {
    background: #d9d9d9;
    border: 2px solid black;
    padding: 15px;
    margin-top: 10px;
}

input, select {
    background: #ffc000;
    border: 1px solid black;
    padding: 3px;
    font-family: Calibri;
}

input.small { width: 100px; }
input.medium { width: 160px; }
input.long { width: 450px; }
select.medium { width: 180px; }
select.long { width: 520px; }

button {
    padding: 6px 14px;
    font-weight: bold;
    cursor: pointer;
    border: 1px solid black;
}

.reset-btn { background: red; color: white; }
.generate-btn { background: #92d050; }
.copy-btn { background: #bdd7ee; }

.green-text {
    color: green;
    font-style: italic;
    margin-left: 15px;
}

.output-box {
    background: #efefef;
    border: 2px solid #1f7a3f;
    padding: 10px;
    height: 240px;
    width: 750px;
    white-space: pre-wrap;
    font-family: "Courier New", monospace;
}

.modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.4);
}

.modal-box {
    background: white;
    width: 350px;
    padding: 20px;
    margin: 15% auto;
    text-align: center;
    border: 2px solid black;
}
</style>
</head>

<body>

<div class="wrapper">

<div class="logo">
    <img src="./safety-logo.png" alt="Safety Logo">
    <div id="clock" class="clock"></div>

    <div class="open-flight-box" id="openFlightBox">
        <div><b>Open flight in:</b></div>
        <button class="grey-btn" onclick="openTidy()">TIDY</button>
        <button class="grey-btn" onclick="openBono()">BONO</button>
    </div>
</div>

<div class="header">
<h1>IRR EVENT LOGGER</h1>
<div class="rev">Rev 2.4</div>
</div>

<!-- SECTION 1 -->
<div>
<span class="section-number">1)</span>
<div class="box" style="width:500px;">
<b>Regarding flight</b>
<button class="reset-btn" style="float:right;" onclick="resetForm()">Reset</button>
<br><br>

Flightnumber:
<input id="flight" class="medium" oninput="checkOpenFlightButtons()"><br><br>

Date:
<input id="date" class="medium" oninput="checkOpenFlightButtons()">
<button onclick="setToday()">Set todays date</button><br><br>

Pax Figures:
<input id="pax" class="small">
</div>
</div>

<br>

<!-- SECTION 2 -->
<div>
<span class="section-number">2)</span>
<div class="box" style="width:1000px;">
<b>Specify Irregularity</b>
<br><br>

Irregularity:
<select id="irr" class="medium" onchange="updateReasonLabel()">
<option>Select</option>
<option>Cancelled</option>
<option>Delayed</option>
<option>Diversion</option>
</select>

&nbsp;&nbsp;

<span id="reason-label">Reason for cancellation:</span>
<select id="reason" class="medium">
<option>Select</option>
<option>Technical</option>
<option>Weather</option>
<option>Operational</option>
<option>Other</option>
</select>

&nbsp;&nbsp;

Rebooking:
<select id="rebooking" class="medium">
<option>Select</option>
<option>Yes</option>
<option>No</option>
</select>

<br><br>

Rebooking Solution:
<select id="solution" class="long">
<option>Select</option>
<option>No alternative option available</option>
<option>First available option</option>
<option>Ground transport arranged</option>
<option>No alternative transport available (pax must arrange own transport and get refund)</option>
<option>Recovery flight arranged</option>
</select>

<br><br>

Spare AC:
<select id="spare" class="medium">
<option>Select</option>
<option>Used</option>
<option>Not available</option>
<option>Not applicable. Would cause longer final delay.</option>
</select>

&nbsp;&nbsp;

Wetlease:
<select id="wetlease" class="medium">
<option>Select</option>
<option>Wetlease arranged</option>
<option>Not an option, would cause longer delay</option>
<option>Not an option due to availability</option>
</select>

<br><br>

Remark (Optional Freetext):
<br>
<input id="remark" class="long">

<br><br>

<button class="generate-btn" onclick="generate()">Generate</button>
<span id="ready" class="green-text"></span>
</div>
</div>

<br>

<!-- SECTION 3 -->
<div>
<span class="section-number">3)</span>
<div class="box" style="width:800px;">
<b>Copy to 15below</b>
<br><br>
<button class="copy-btn" onclick="copyText()">Copy</button>
<div id="output" class="output-box"></div>
</div>
</div>

</div>

<div class="modal-overlay" id="modal">
    <div class="modal-box">
        <div id="modal-message"></div>
        <br>
        <button onclick="closeModal()">OK</button>
    </div>
</div>

<script>

/* ---- OPEN FLIGHT BUTTONS ---- */

function checkOpenFlightButtons() {
    let flightValue = document.getElementById("flight").value.trim();
    let dateValue = document.getElementById("date").value.trim();
    let box = document.getElementById("openFlightBox");

    if (flightValue !== "" && dateValue !== "") {
        box.style.display = "block";
    } else {
        box.style.display = "none";
    }
}

function convertDateFormats() {
    let input = document.getElementById("date").value.trim();
    let match = input.match(/^(\d{1,2})([A-Za-z]{3})(\d{2})$/);
    if (!match) return null;

    let day = match[1].padStart(2,'0');
    let monthStr = match[2].toUpperCase();
    let year = "20" + match[3];

    const months = {
        JAN:"01", FEB:"02", MAR:"03", APR:"04", MAY:"05", JUN:"06",
        JUL:"07", AUG:"08", SEP:"09", OCT:"10", NOV:"11", DEC:"12"
    };

    let month = months[monthStr];
    if (!month) return null;

    return {
        tidy: `${day}/${month}/${year}`,
        bono: `${day}-${month}-${year}`
    };
}

function openTidy() {
    let flight = document.getElementById("flight").value.trim().toUpperCase();
    let dates = convertDateFormats();
    if (!dates) return;

    let url = `https://tidy.nas.dev/View/CDM/CDMFlightDetails.aspx?flightid=${flight}&flightdate=${dates.tidy}`;
    window.open(url, "_blank");
}

function openBono() {
    let flight = document.getElementById("flight").value.trim().toUpperCase();
    let dates = convertDateFormats();
    if (!dates) return;

    let url = `https://bono.nas.dev/nas/actions/flightreport/flightreport.action?searchBy=flightAndDate&flight=${flight}&flightDate=${dates.bono}&includeDeleted=false&limit=300&offset=0`;
    window.open(url, "_blank");
}

/* ---- EXISTING ORIGINAL LOGIC ---- */

function updateReasonLabel() {
    let irrValue = document.getElementById("irr").value;
    let label = document.getElementById("reason-label");

    if (irrValue === "Delayed") {
        label.innerText = "Reason for delay:";
    } else if (irrValue === "Diversion") {
        label.innerText = "Reason for diversion:";
    } else {
        label.innerText = "Reason for cancellation:";
    }
}

document.querySelectorAll("input, select").forEach((el, index, arr) => {
    el.addEventListener("keydown", function(e) {
        if (e.key === "Enter") {
            e.preventDefault();
            let next = arr[index + 1];
            if (next) next.focus();
        }
    });
});

function updateClock() {
    let now = new Date();
    let hours = String(now.getHours()).padStart(2,'0');
    let minutes = String(now.getMinutes()).padStart(2,'0');
    let seconds = String(now.getSeconds()).padStart(2,'0');
    let day = String(now.getDate()).padStart(2,'0');
    let month = now.toLocaleString("en-US", { month: "short" }).toUpperCase();
    let year = now.getFullYear().toString().slice(-2);

    document.getElementById("clock").innerText =
        `${hours}:${minutes}:${seconds} / ${day}${month}${year}`;
}

setInterval(updateClock, 1000);
updateClock();

function setToday() {
    let today = new Date();
    let day = String(today.getDate()).padStart(2, '0');
    let month = today.toLocaleString("en-US", { month: "short" }).toUpperCase();
    let year = today.getFullYear().toString().slice(-2);
    document.getElementById("date").value = `${day}${month}${year}`;
    checkOpenFlightButtons();
}

/* generate(), copyText(), resetForm() remain exactly as your previous working version */

</script>

</body>
</html>
